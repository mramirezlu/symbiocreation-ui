<div class="so">

  <app-intranet-menu></app-intranet-menu>

  <h2 class="so-title">{{ 'STATS.OVERVIEW_TITLE' | translate }}</h2>

  <section class="so-top">
    <!-- KPIs -->
    <div class="so-kpis">
      <div class="so-kpi teal">
        <div class="so-kpi-icon"><mat-icon>hub</mat-icon></div>
        <div class="so-kpi-text">
          <div class="so-kpi-value">{{ totalSymbiocreations }}</div>
          <div class="so-kpi-label">{{ 'STATS.TOTAL_SYMBIOCREATIONS' | translate }}</div>
        </div>
      </div>

      <div class="so-kpi cyan">
        <div class="so-kpi-icon"><mat-icon>group</mat-icon></div>
        <div class="so-kpi-text">
          <div class="so-kpi-value">{{ totalUsers }}</div>
          <div class="so-kpi-label">{{ 'STATS.TOTAL_USERS' | translate }}</div>
        </div>
      </div>

      <div class="so-kpi purple">
        <div class="so-kpi-icon"><mat-icon>lightbulb</mat-icon></div>
        <div class="so-kpi-text">
          <div class="so-kpi-value">{{ totalIdeas }}</div>
          <div class="so-kpi-label">{{ 'STATS.TOTAL_IDEAS' | translate }}</div>
        </div>
      </div>
    </div>

    <!-- Gráfico de crecimiento -->
    <div class="so-chart">
      <app-line-chart-growth-history></app-line-chart-growth-history>
    </div>
  </section>

  <!-- Tendencias / rankings -->
  <section class="so-tabs-panel">
    <mat-tab-group>
      <mat-tab [label]="'STATS.IDEA_TRENDS' | translate">
        <app-trending-topics-ideas></app-trending-topics-ideas>
      </mat-tab>
      <mat-tab [label]="'STATS.TOP_SYMBIOCREATIONS' | translate">
        <app-top-symbiocreations-ranking></app-top-symbiocreations-ranking>
      </mat-tab>
      <mat-tab [label]="'STATS.TOP_USERS' | translate">
        <app-top-users-ranking></app-top-users-ranking>
      </mat-tab>
    </mat-tab-group>
  </section>

</div>
