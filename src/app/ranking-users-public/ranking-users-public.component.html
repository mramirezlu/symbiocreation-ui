<div class="container-80 container-general">

  <h2 class="font-26 bolder gray-900 container-header">{{ 'RANKING.TITLE' | translate }}</h2>

    @for (user of users; track user; let i = $index; let last = $last) {

        <span matListItemIcon class="bolder font-26 pink-A200">{{ i + 1 }}</span>
        <div matListItemTitle>
          <a class="bold font-18 cyan-color-2 rk-name" [routerLink]="['/perfil', user.id]">{{ user.name || user.firstName + " " + user.lastName }}</a>
          <span class="font-14 gray-600" style="float: right; margin-top: 18px;">{{ user.email }}</span>
        </div>
        <div matListItemLine>
          <span class="font-14 gray-700">{{ 'RANKING.SCORE' | translate }} {{ user.score }}</span>
        </div>
